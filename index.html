margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
background:linear-gradient(-45deg,#4f46e5,#9333ea,#06b6d4,#22c55e);
background-size:400% 400%;
animation:bg 15s ease infinite;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.card{

width:420px;
max-width:92%;
padding:35px;
border-radius:30px;

background:rgba(255,255,255,.12);
backdrop-filter:blur(18px);

box-shadow:
0 20px 50px rgba(0,0,0,.35);

text-align:center;
color:white;

animation:fade 1s ease;
}

@keyframes fade{

from{
opacity:0;
transform:translateY(50px);
}

to{
opacity:1;
transform:translateY(0);
}

}

.logo{

width:120px;
height:120px;
border-radius:50%;
margin:auto;

background:linear-gradient(45deg,#00ff99,#00c3ff);

font-size:60px;

0 0 30px #00ff99;

margin-bottom:20px;

}

h1{

font-size:32px;

margin-bottom:8px;

}

p{

opacity:.8;

margin-bottom:25px;

}

.button{

display:block;

text-decoration:none;

color:white;

padding:16px;

margin:15px 0;

border-radius:16px;

font-size:18px;

font-weight:600;

transition:.35s;

background:rgba(255,255,255,.15);

border:1px solid rgba(255,255,255,.25);

}

.button:hover{

transform:translateY(-5px) scale(1.03);

background:rgba(255,255,255,.25);

box-shadow:0 0 25px cyan;

}

.footer{

margin-top:25px;

opacity:.7;

font-size:13px;

}

.circle{

position:absolute;

border-radius:50%;

filter:blur(90px);

opacity:.5;

animation:move 15s infinite alternate;

}

.c1{

width:250px;
height:250px;
background:#00ffd5;

top:-80px;
left:-80px;

}

.c2{

width:300px;
height:300px;
background:#8b5cf6;

bottom:-120px;
right:-100px;

}

@keyframes move{

to{

transform:translate(100px,-80px);

}

}

</style>
